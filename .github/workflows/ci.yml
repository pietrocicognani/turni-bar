name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/Turni.Tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valida HTML
        run: npx --yes html-validate@8 src/Turni.Web/wwwroot/index.html
